<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blocked by IOC Triage</title>
<link rel="stylesheet" href="common.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--block-bg); }
  main { width: min(640px, 100%); }
  .shield { width: 56px; height: 56px; border-radius: 16px; background: var(--block); color: #fff; display: grid; place-items: center; font-size: 30px; font-weight: 800; margin-bottom: 16px; }
  h1 { font-size: 26px; margin-bottom: 8px; }
  .lead { font-size: 15px; margin: 0 0 16px; }
  .card { margin: 16px 0; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
  .score { font-size: 13px; }
  footer { margin-top: 24px; font-size: 12px; }
</style>
</head>
<body>
<main>
  <div class="shield" aria-hidden="true">!</div>
  <h1 id="title">Dangerous site blocked</h1>
  <p class="lead" id="lead">IOC Triage stopped this page because it shows strong signs of phishing.</p>
  <div class="card">
    <div class="row"><span class="pill lvl-block">Blocked</span><span class="score muted" id="score"></span></div>
    <div class="mono" id="url" style="margin-top:10px"></div>
    <ul class="reasons" id="reasons"></ul>
  </div>
  <p class="muted">If this page asked you to sign in or pay, do not try again from another device. If you already entered a password, change it now and tell your security team.</p>
  <div class="actions">
    <button class="primary" id="back">Go back to safety</button>
    <button id="report">Report — this is wrong</button>
    <button class="link" id="proceed" hidden>Continue anyway (not recommended)</button>
  </div>
  <footer class="muted">IOC Triage</footer>
</main>
<script src="../lib/config.js"></script>
<script src="blocked.js"></script>
</body>
</html>
