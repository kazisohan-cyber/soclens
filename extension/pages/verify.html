<!doctype html>
<html lang="en">
<head>

<title>IOC Triage: was this you?</title>
<link rel="stylesheet" href="common.css">
<style>
  main { width: min(560px, 100%); margin: 0 auto; padding: 32px 16px; }

</style>

<body>
<main>
  <header><img src="../icons/icon48.png" alt=""><h1>Was this you?</h1></header>
  <p class="muted">Your security team asks you to confirm a recent sign-in. IOC Triage only ever asks here, in your browser, never by email or phone.</p>
  <div id="list"></div>
  <p class="muted" id="empty" hidden>Nothing to confirm right now. You can close this tab.</p>
</main>
