<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IOC Triage</title>
<link rel="stylesheet" href="common.css">
<style>
  body { width: 360px; padding: 12px; }
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  header img { width: 22px; height: 22px; }
  header h1 { font-size: 15px; flex: 1; }
  .card { padding: 12px; margin-bottom: 10px; }
  .host { font-weight: 600; margin: 6px 0 2px; word-break: break-all; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 6px; }
  .health { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; margin-bottom: 10px; background: var(--ok-bg); font-size: 13px; }
  .health .muted { font-size: 12px; }
  .health .hdot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; background: var(--ok); flex: none; }
  .health.warn { background: var(--warn-bg); } .health.warn .hdot { background: var(--warn); }
  .health.bad { background: var(--block-bg); } .health.bad .hdot { background: var(--block); }
  .stat { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; padding: 5px 0; font-size: 13px; border-top: 1px solid var(--line); }
  .stat:first-child { border-top: 0; }
  .stat .v { text-align: right; font-weight: 600; }
  .stat .v.ok { color: var(--ok); } .stat .v.warn { color: var(--warn); } .stat .v.bad { color: var(--block); } .stat .v.off { color: var(--muted); font-weight: 400; }
  .stat .hint { grid-column: 1 / 3; color: var(--muted); font-size: 11.5px; }
  .stat .hint button { padding: 2px 8px; font-size: 11.5px; margin-left: 4px; }
  .ev { border-top: 1px solid var(--line); font-size: 12px; }
  .ev:first-of-type { border-top: 0; }
  .ev > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 10px 1fr auto; gap: 2px 8px; padding: 7px 0; }
  .ev > summary::-webkit-details-marker { display: none; }
  .ev .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; background: var(--muted); }
  .sev-critical .dot { background: var(--block); } .sev-high .dot { background: #f04438; } .sev-medium .dot { background: var(--warn); } .sev-low .dot { background: var(--ok); }
  .ev .t { font-weight: 600; font-size: 12.5px; }
  .ev .when { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .ev .sub { grid-column: 2 / 4; color: var(--muted); word-break: break-word; }
  .ev .sub b { color: var(--text); font-weight: 600; }
  .ev .why { grid-column: 2 / 4; }
  .ev .tag { display: inline-block; font-size: 10.5px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin: 2px 4px 0 0; }
  .ev .tag.bad { color: var(--block); border-color: var(--block); }
  .ev .more { padding: 0 0 8px 18px; }
  .ev .more ul { margin: 2px 0 6px; padding-left: 16px; }
  .ev .more .mono { font-size: 11px; color: var(--muted); }
  .ev .more button { padding: 4px 9px; font-size: 11.5px; margin: 6px 6px 0 0; }
  .row { margin-top: 10px; }
  #empty { font-size: 12px; }
</style>
</head>
<body>
<header>
  <img src="../icons/icon32.png" alt="">
  <h1>IOC Triage</h1>
  <a href="#" id="opts" class="muted" style="font-size:12px">Settings</a>
</header>

<section class="card" style="padding:10px 12px">
  <div class="row" style="justify-content:space-between">
    <span><b>Analyst panel</b><br><span class="muted" style="font-size:12px">Investigate IOCs, headers, client memory</span></span>
    <button class="primary" id="analyst">Open</button>
  </div>
</section>

<section class="card" id="verifyBox" hidden style="border-color:var(--warn)">
  <h2>Was this you?</h2>
  <div id="verifyList"></div>
</section>

<section class="card" id="site">
  <span class="pill" id="lvl">—</span>
  <div class="host" id="host">No web page</div>
  <ul class="reasons" id="reasons"></ul>
  <div class="row" id="siteActions" hidden>
    <button id="report">Report this site</button>
    <button class="link" id="trust" hidden>Trust this site</button>
  </div>
</section>

<section class="card" id="protCard">
  <div class="health" id="health"><span class="hdot"></span><div><b id="healthText">Checking…</b><div class="muted" id="healthSub"></div></div></div>
  <h2>Protection</h2>
  <div id="prot"></div>
  <div class="row" id="communityActions" hidden>
    <button class="link" id="toggleShare"></button>
    <button class="link" id="connect" hidden>Set up community protection</button>
  </div>
</section>

<section class="card">
  <h2>Recent activity</h2>
  <div id="events"></div>
  <div id="empty" class="muted">Nothing blocked yet.</div>
</section>
<div class="muted" style="font-size:11px;text-align:center" id="ver"></div>
<script src="../lib/public-suffixes.js"></script>
<script src="../lib/analyzer.js"></script>
<script src="../lib/activity.js"></script>
<script src="verify.js"></script>
<script src="popup.js"></script>
</body>
</html>
