{% extends "base.html" %}
{% block body %}
<h1>Tenants</h1>
<div class="scroll"><table>
<tr><th>Id (X-SOCLens-Tenant)</th><th>Name</th><th>API key</th><th>Created</th></tr>
{% for t in tenants %}<tr><td><a href="/tenants/{{ t.id }}">{{ t.id }}</a></td><td>{{ t.name }}</td><td>…{{ t.api_key_hint }}</td><td>{{ t.created_at.strftime('%Y-%m-%d') }}</td></tr>{% endfor %}
</table></div>
<form method="post" action="/tenants" class="card inline">
  <h3>New tenant</h3>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input name="slug" placeholder="client-a" required pattern="[a-z0-9][a-z0-9-]{1,62}">
  <input name="name" placeholder="Client A Sdn Bhd">
  <button>Create</button>
</form>
{% endblock %}
